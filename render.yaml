services:
  - type: web
    name: open-house-register
    runtime: docker
    plan: 0.5c-512mb
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: open-house-register-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: open-house-register-db
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
