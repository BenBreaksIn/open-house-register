name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: houseworks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.94.0 fmt --check
      - run: cargo +1.94.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.94.0 test --locked
      - run: cargo +1.94.0 test --locked --tests -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres:test-password@localhost:5432/houseworks_test
      - run: cargo +1.94.0 build --locked --release --bins
