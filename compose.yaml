services:
  app:
    build: .
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      DATABASE_URL: postgres://houseworks:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/houseworks
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3030}
      MAX_VISITORS_PER_EVENT: ${MAX_VISITORS_PER_EVENT:-1000}
      MAX_VISITORS_TOTAL: ${MAX_VISITORS_TOTAL:-10000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: houseworks
      POSTGRES_USER: houseworks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseworks -d houseworks"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
